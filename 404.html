<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Out of Bounds</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  
  <!-- Fonts & Stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="error-page-body">

  <!-- Ambient Glow Background Accents -->
  <div class="ambient-glow glow-top" aria-hidden="true"></div>
  <div class="ambient-glow glow-bottom" aria-hidden="true"></div>

  <!-- Central Content Focus Area -->
  <main class="error-container">

    <!-- Badge Section -->
    <div class="error-badge">
      <div class="logo-mark-mini">TO</div>
      <span class="error-code">ERROR 404</span>
    </div>

    <!-- Main Typography -->
    <h1 class="error-title">Looks like you've gone off-script.</h1>
    <p class="error-description">
      This page isn't in the blueprint. Let's redirect you back to solid ground.
    </p>

    <!-- Main Actions -->
    <div class="error-actions">
      <a href="/" class="btn btn-primary">
        Back to Safety <span class="btn-icon" aria-hidden="true">→</span>
      </a>
      <a href="/#contact" class="btn-secondary">
        Contact Support
      </a>
    </div>

    <!-- Footer Quick Links -->
    <div class="error-footer-links">
      <span>Looking for something else?</span>
      <div class="quick-links">
        <a href="/">Home</a>
        <span class="dot">•</span>
        <a href="/#work">Work</a>
        <span class="dot">•</span>
        <a href="/#about">About</a>
      </div>
    </div>

  </main>

</body>
</html>
